  - id: GS-CODE-001
    tipo: resposta
    resposta: "O hook PostToolUse (matcher Write|Edit) roda scripts/guard-ap-tokens.mjs. Se achar um hexadecimal (#rgb/#rrggbb) fora de comentários e de linhas com %23, sai com código 2 e devolve ao Claude a mensagem '[guard-ap] Hexadecimal proibido' com as linhas infratoras. O teste Playwright 'evolução 13' também reprova qualquer #rrggbb no body."
    evidencias:
      - caminho: "scripts/guard-ap-tokens.mjs"
        linhas: "6-10"
        trecho: "* do agente: aqui ela é aplicada mecanicamente. Qualquer hexadecimal escrito em * src/apresentacao.html ou src/js/apresentacao/** bloqueia a ferramenta. * * Sai 2 (bloqueia e devolve a mensagem ao Claude) quando encontra violação. * Configurado em .claude/settings.json (matcher Write|Edit)."
      - caminho: "scripts/guard-ap-tokens.mjs"
        linhas: "51-58"
        trecho: "if (offenders.length) { console.error( `[guard-ap] Hexadecimal proibido em ${filePath}\\n` + offenders.join('\\n') + `\\n\\nToda cor da página v3.0 vive em src/apresentacao.css como var(--ap-*).\\n` + `Ver docs/specs/pages/apresentação/ADR-ap-001-namespace-e-excecao-dark-tech.md` ); process.exit(2);"
      - caminho: ".claude/settings.json"
        linhas: "25-31"
        trecho: "\"PostToolUse\": [ { \"matcher\": \"Write|Edit\", \"hooks\": [ { \"type\": \"command\", \"command\": \"node scripts/guard-ap-tokens.mjs\""
      - caminho: "tests/apresentacao.spec.js"
        linhas: "270-276"
        trecho: "// Lido do DOM, não por fatiamento de string: `indexOf('<body')` casa também // com a palavra dentro de comentários no <head>. const body = await page.evaluate(() => document.body.outerHTML); const hits = [...body.matchAll(/#[0-9a-fA-F]{6}\\b/g)].map((m) => m[0]); expect(hits, `cores fora de src/apresentacao.css: ${hits.join(', ')}`).toEqual([]); }); "
    confianca: media
    nota: "Ressalvas verificadas: (1) por ser PostToolUse, o arquivo já foi gravado quando o hook roda; ele não desfaz a escrita, só sinaliza ao agente. (2) AGENTS.md:125-126 diz que tests/apresentacao.tokens.test.mjs também aplica a regra, mas esse teste só lê src/apresentacao.css (linha 18) e não varre o HTML. Quem cobre o HTML é tests/apresentacao.spec.js. (3) src/apresentacao.html:53 já contém '#0A0A0C' no meta theme-color, que o hook acusaria em qualquer edição do arquivo; o teste Playwright só olha o body."
