  - id: GS-SPEC-001
    tipo: resposta
    resposta: "7:1 (texto principal da Camada 3 sobre o fundo do card), acima do mínimo AA de 4.5:1."
    evidencias:
      - caminho: "docs/specs/pages/apresentação/especificacao-ux-mauricio-issei.md"
        linhas: "27"
        trecho: "* **Camada 3 (Núcleo):** o dark mode dominante das Camadas 1 e 2 é preservado — o fundo permanece grafite escuro. A sensação de \"mesa de trabalho iluminada\" é criada apenas por iluminação localizada: contornos de cards, bordas finas e fundos internos em um grafite ligeiramente mais claro que o base. Isso mantém legibilidade e conforto visual sem romper a coerência tonal da página. **Critério mínimo obrigatório:** mesmo com fundo escuro, o texto principal da Camada 3 deve manter contraste de pelo menos 7:1 em relação ao fundo do card (grafite claro + texto branco quase puro) — o padrão exigido para densidade técnica prolongada, não o mínimo aceitável de WCAG AA. Validar em monitores com calibragem mediana, não apenas em telas de referência."
      - caminho: "docs/specs/pages/apresentação/especificacao-ux-mauricio-issei.md"
        linhas: "207"
        trecho: "11. *(v3.0)* Contraste mínimo de 7:1 definido explicitamente para texto da Camada 3."
      - caminho: "AGENTS.md"
        linhas: "121"
        trecho: "e um piso de contraste de **7:1** na Camada 3. **É a única exceção à paleta Dark Tech.**"
    confianca: alta
    nota: "Os testes também medem as Camadas 1 e 2 contra 7:1 (tests/apresentacao.tokens.test.mjs:44). O token atual dá 17.11:1 segundo o comentário em src/apresentacao.css:33 (afirmado, não recalculado)."
  - id: GS-SPEC-002
    tipo: resposta
    resposta: "O ADR-eai-002 (Aceito, 2026-06-17) troca o bpmn-js por SVG/CSS próprio. Motivos: bpmn-js é pesado (~centenas de KB) e traz DOM/canvas próprio, com pouco controle de acessibilidade e tema; o SVG mantém o bundle enxuto, o tema Dark Tech e o controle de teclado e equivalentes textuais. Pode mudar na V2 (WU-13), só se a edição real de diagramas pelo usuário justificar o peso, e então com um novo ADR."
    evidencias:
      - caminho: "docs/decisions/ADR-eai-002-fluxos-em-svg-sem-bpmnjs.md"
        linhas: "10-11"
        trecho: "determinístico, Saga, DLQ e roteamento por confiança. `bpmn-js` é uma dependência pesada (~centenas de KB) e traz seu próprio DOM/canvas, com controle limitado de acessibilidade e de tema."
      - caminho: "docs/decisions/ADR-eai-002-fluxos-em-svg-sem-bpmnjs.md"
        linhas: "21-22"
        trecho: "`bpmn-js` **editável** fica **diferido para a V2** (WU-13), e só entra se a edição real de diagramas pelo usuário justificar o peso — então com novo ADR."
      - caminho: ".ai/state/PROGRESS.md"
        linhas: "52"
        trecho: "**🎉 Onda V2 COMPLETA** (WU-12, WU-14). WU-13 (bpmn-js editável) **diferido** por ADR-eai-002."
      - caminho: ".ai/state/PROGRESS.md"
        linhas: "65"
        trecho: "Único item diferido: WU-13 (bpmn-js editável, ADR-eai-002)."
    confianca: alta
    nota: "Observação: o PROGRESS.md dá a Onda V2 como COMPLETA e mantém a WU-13 diferida. A 'janela' da V2 prevista no ADR passou sem o bpmn-js; o gatilho que resta é a necessidade de edição real mais um novo ADR."
