    evidencias:
      - caminho: "src/knowledge-os-presentation.html"
        linhas: "690"
        trecho: "<div class=\"kpi-card\"><div class=\"kpi-value\">18</div><div class=\"kpi-label\">KPIs cognitivos + FinOps</div></div>"
      - caminho: "src/knowledge-os-presentation.html"
        linhas: "1014"
        trecho: "<li>18 KPIs cognitivos divididos em 4 camadas (§7).</li>"
      - caminho: "src/knowledge-os-presentation.html"
        linhas: "710"
        trecho: "<li><span class=\"ed-mode\">Verificar</span> <a href=\"#diagnostico\">10 dimensões da revisão crítica</a>, <a href=\"#seguranca\">Limites da IA</a> e <a href=\"#observabilidade\">22 KPIs cognitivos</a>: cada gap da proposta original com sua contramedida, os Circuit Breakers e como medir.</li>"
      - caminho: "src/knowledge-os-presentation.html"
        linhas: "2109"
        trecho: "<h2 class=\"text-3xl md:text-4xl font-bold text-white section-title\">22 KPIs cognitivos em 5 camadas</h2>"
    confianca: alta
    nota: "Contagem feita nas linhas <tr> do tbody (src/knowledge-os-presentation.html:2122-2152). O '18' trata FinOps à parte e o '22' conta FinOps como camada de KPI cognitivo. O roadmap ainda cita '5 KPIs cognitivos baseline' na Fase 1 (linha 2203)."
