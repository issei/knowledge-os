[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-os"
version = "0.1.0.dev0"
description = "Knowledge OS Enterprise: recuperação de conhecimento técnico com evidências rastreáveis."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
kos = "kos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kos = ["store/*.sql", "discovery/*.json"]
